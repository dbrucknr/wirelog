[package]
name = "wirelog"
version = "0.1.0"
edition = "2024"
description = "Structured JSON logger with zerolog-inspired ergonomics"
license = "MIT"
repository = "https://github.com/dbrucknr/wirelog"
keywords = ["logging", "log", "json", "structured-logging", "zerolog"]
categories = ["development-tools::debugging"]
rust-version = "1.85"

# Compile-time level filtering. Each feature sets the minimum level — levels below
# it are compiled out entirely and cost nothing at runtime. Only one should be set;
# if multiple are set, the most restrictive wins.
#
#   level-debug  — compile out trace
#   level-info   — compile out trace, debug
#   level-warn   — compile out trace, debug, info
#   level-error  — compile out trace, debug, info, warn
#   level-off    — compile out all levels
[features]
level-debug  = []
level-info   = []
level-warn   = []
level-error  = []
level-off    = []

[dependencies]
itoa = "1"
ryu = "1"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[[bench]]
name = "logging"
harness = false
