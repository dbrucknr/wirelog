[package]
name = "wirelog"
version = "0.1.0"
edition = "2024"

[dependencies]
itoa = "1"
ryu = "1"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[[bench]]
name = "logging"
harness = false
